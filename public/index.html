<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Organizador de PDFs
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>
<body>

<div class="container">

    <h1>
        Organizador de PDFs
    </h1>

    <input
        type="file"
        id="pdfs"
        multiple
        accept=".pdf"
    >

    <ul id="listaArquivos"></ul>

    <button id="btnGerar">
        Gerar PDF Consolidado
    </button>

    <div id="resultado"></div>

</div>

<script src="app.js"></script>

</body>
</html>
